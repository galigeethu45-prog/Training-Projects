<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:papayawhip;
            color:rgb(7, 6, 6);
            font-size:20px;
        }
        p{
            display:flex;
            gap:10px;
            justify-content:center;
            margin-left:0px;

        }
        button{
            width:50px;
            height:50px;
            border-radius:25px;
            border:none;
            font-size:20px;
            overflow:hidden;
            background-color:deepskyblue;
            color:white;
            cursor:pointer;
            transition: transform 0.2s ease-in-out;
        }
        #clear{
            width:220px;
            border-radius:25px;
            border:none;
            font-size:20px;
            overflow:hidden;
            background-color:rgb(255, 0, 0);
            color:white;
            cursor:pointer;
            transition: transform 0.2s ease-in-out;
            
        }
        #clear:hover{
            border-radius: 20px 40px;
            background-color:rgb(16, 11, 11);
            color:rgb(255, 255, 255);
            transform: scale(1.2);
            transition: transform 0.2s ease-in-out;
        }
        button:hover{
            background-color:rgb(251, 115, 244);
            color:rgb(46, 40, 40);
            transform: scale(1.2);
            transition: transform 0.2s ease-in-out;
        }
        .orange-btn{
            width:50px;
            height:50px;
            border-radius:25px;
            border:none;
            font-size:20px;
            overflow:hidden;
            background-color:rgb(255, 123, 0);
            color:white;
            cursor:pointer;
            transition: transform 0.2s ease-in-out;
        }
        .orange-btn:hover{
            background-color:rgb(251, 115, 149);
            color:rgb(46, 40, 40);
            transform: scale(1.2);
            transition: transform 0.2s ease-in-out;
        }
        h1{
            text-align:center;
            font-size:80px;
            margin-top:200px;
        }


    </style>
</head>
<body>
    <div class="whole">
        <div class="Display">
            <p class="js-calculation calculation"></p>
        </div>
        <div class="buttons">
            <p>
            <button class="gray-btn" id="one" onclick="
                updateCalculation('1')">1</button>
            <button class="gray-btn" id="two" onclick="updateCalculation('2')">2</button>
            <button class="gray-btn" id="three" onclick="updateCalculation('3')">3</button>
            <button class="orange-btn" id="plus" onclick="updateCalculation('+')">+</button>
            </p>

            
        </div>
        <div class="buttons">
            <p>
            <button class="gray-btn" id="four" onclick="updateCalculation('4')">4</button>
            <button class="gray-btn" id="five" onclick="updateCalculation('5')">5</button>
            <button class="gray-btn" id="six" onclick="updateCalculation('6')">6</button>
            <button class="orange-btn" id="minus" onclick="updateCalculation('-')">-</button>
            </p>
        </div>
        <div class="buttons">
            <p>
            <button class="gray-btn" id="seven" onclick="updateCalculation('7')">7</button>
            <button class="gray-btn" id="eight" onclick="updateCalculation('8')">8</button>
            <button class="gray-btn" id="nine" onclick="updateCalculation('9')">9</button>
            <button class="orange-btn" id="multiply" onclick="updateCalculation('*')">*</button>
            </p>
        </div>
        <div class="buttons">
            <p>
            <button class="gray-btn" id="zero" onclick="updateCalculation('0')">0</button>
            <button class="gray-btn" id="Dot" onclick="updateCalculation('.')">.</button>
            <button class="gray-btn" id="equals" onclick="calculation = eval(calculation);
            displayCalculation();
            localStorage.setItem('calculation', calculation);">= </button>
            <button class="orange-btn" id="divide" onclick="updateCalculation('/')">/</button>
            </p>
        </div>
        <div class="clear-btn buttons">
            <p>
            <button class="gray-btn" id="clear" onclick="calculation = '';
            displayCalculation();
            localStorage.setItem('calculation', calculation);">Clear</button>
            </p>

        </div>
        <h1>WELCOME TO MY CALCULATOR APP</h1>
    </div>
    <script>
        let calculation = localStorage.getItem('calculation') || '';
        displayCalculation();

        function updateCalculation(value){
            calculation += value;
            displayCalculation();
            localStorage.setItem('calculation', calculation);
        }

        function displayCalculation(){
            document.querySelector('.js-calculation').innerHTML = calculation;

        }
    </script>
</body>
</html>
